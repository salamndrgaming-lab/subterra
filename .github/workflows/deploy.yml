name: deploy

on:
  push:
    branches:
      - main
      # Preview environment — any claude/** feature branch gets a deploy
      # of the API Worker under the `preview` env, so the corresponding
      # Pages preview build can talk to a Worker that has the same code
      # as the branch. See apps/api/wrangler.toml [env.preview].
      - 'claude/**'

concurrency:
  # One in-flight deploy per ref — prod and each feature branch each get
  # their own group so a long prod deploy doesn't block a preview push.
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: ${{ github.ref == 'refs/heads/main' && 'production' || 'preview' }}
    env:
      IS_PROD: ${{ github.ref == 'refs/heads/main' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm ci
      - run: npm run build

      # Migrations only on prod. Feature branches share the same D1, so
      # auto-applying half-baked schema changes from a branch would risk
      # the prod schema. Migrations land via the main-branch deploy.
      - name: Apply D1 migrations (prod only)
        if: ${{ env.IS_PROD == 'true' && hashFiles('infra/migrations/*.sql') != '' }}
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --yes wrangler@3 d1 migrations apply subterra --remote

      - name: Inject D1 database ID into wrangler.toml
        env:
          CLOUDFLARE_D1_DATABASE_ID: ${{ secrets.CLOUDFLARE_D1_DATABASE_ID }}
        run: |
          test -n "$CLOUDFLARE_D1_DATABASE_ID" \
            || { echo "::error::CLOUDFLARE_D1_DATABASE_ID secret is empty"; exit 1; }
          # The placeholder appears on its own line in both the top-level
          # and [env.preview] d1_databases blocks; sed -i replaces the
          # first match per line, so this swap covers both occurrences.
          sed -i "s/00000000-0000-0000-0000-000000000000/$CLOUDFLARE_D1_DATABASE_ID/" \
            apps/api/wrangler.toml

      - name: Deploy API Worker
        id: deploy-worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        working-directory: apps/api
        run: |
          if [ "$IS_PROD" = "true" ]; then
            npx --yes wrangler@3 deploy | tee /tmp/wrangler-deploy.log
          else
            # Deploys to subterra-api-preview.<account>.workers.dev.
            # The web app resolves this URL at runtime (lib/api-base.ts)
            # for Pages preview builds, where CI can't bake env vars.
            npx --yes wrangler@3 deploy --env preview | tee /tmp/wrangler-deploy.log
          fi
          # Extract the deployed workers.dev URL for the web build below.
          WORKER_URL=$(grep -oE 'https://[a-z0-9.-]+\.workers\.dev' /tmp/wrangler-deploy.log | head -1)
          echo "worker_url=$WORKER_URL" >> "$GITHUB_OUTPUT"
          echo "Deployed Worker at: $WORKER_URL"

      # Rebuild the web bundle with VITE_API_URL baked in. The earlier
      # `npm run build` ran without it, which left the bundle pointing
      # at the localhost fallback — every visitor's browser would try
      # to fetch tiles from their own machine. Vite env vars are baked
      # at build time, so a rebuild after the Worker deploy (when we
      # know the URL) is required.
      - name: Rebuild web with API URL (prod only)
        if: ${{ env.IS_PROD == 'true' }}
        env:
          VITE_API_URL: ${{ steps.deploy-worker.outputs.worker_url }}
        run: |
          test -n "$VITE_API_URL" \
            || { echo "::error::could not extract worker URL from wrangler output"; exit 1; }
          npm run build:web

      # Pages deploy from CI is prod-only. Feature branches get
      # preview-deployed automatically by Cloudflare Pages' Git
      # integration, so running it here too would duplicate the build
      # and race the auto-deploy.
      - name: Deploy web app to Pages (prod only)
        if: ${{ env.IS_PROD == 'true' }}
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --yes wrangler@3 pages deploy apps/web/dist --project-name=subterra --branch=main
