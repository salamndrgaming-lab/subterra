name: rasters

# One-shot raster pre-tile workflow for USGS geophysics products
# (Bouguer gravity, aeromag, future radiometric). Manual-dispatch only:
# never runs on push, never on a schedule. USGS GeoTIFF download URLs
# aren't stable enough to assume they'll keep working on every commit,
# so triggering is a deliberate maintainer action with the verified URL
# passed as a workflow input.
#
# Pipeline per dataset:
#   download GeoTIFF (or .zip → extract the .tif) → reproject to
#   EPSG:3857 → apply color ramp → gdal2tiles to PNG pyramid → upload
#   to R2 at rasters/<dataset>/{z}/{x}/{y}.png
#
# After a successful run, the corresponding LayerDef in
# packages/shared/src/layers.ts can be toggled in the sidebar and the
# Worker route apps/api/src/index.ts /rasters/* will serve the new tiles.
#
# Cost note: a CONUS GeoTIFF tiled 0-9 is ~50k PNG files (~300 MB).
# R2 upload takes ~5 min over the workflow's network; tippecanoe-class
# upload concurrency from boto3 keeps it bounded.

on:
  workflow_dispatch:
    inputs:
      dataset:
        description: 'Which dataset to pre-tile'
        required: true
        type: choice
        options:
          - gravity
          - aeromag
          - radiometric
      source_url:
        description: >-
          Verified upstream URL. REQUIRED. Accepts a direct GeoTIFF
          (.tif) OR a .zip bundle (ScienceBase ships GeoTIFF grids
          zipped) — the pipeline sniffs the bytes and extracts the .tif
          from a zip automatically. Find via USGS mrdata.usgs.gov,
          USGS ScienceBase, or the dataset's documentation page.
        required: true
        type: string
      tif_member:
        description: >-
          For a .zip source_url that bundles multiple GeoTIFFs: a
          case-insensitive substring of the .tif filename to extract
          (e.g. "eU" to pick equivalent-uranium out of the radiometric
          K/eU/eTh release). Leave blank to take the largest .tif in the
          zip. Ignored for a direct .tif URL.
        required: false
        type: string
        default: ''
      color_ramp:
        description: >-
          Override the color ramp by name — a file in
          etl/raster/colorramps/ without the .clr suffix (e.g.
          "radiometric_eu", "radiometric_eth", "radiometric_k"). Leave
          blank to use the dataset default (gravity / aeromag /
          radiometric). Must match the physical quantity of the grid
          you pass, or the map renders one flat color.
        required: false
        type: string
        default: ''
      max_zoom:
        description: 'Maximum tile pyramid zoom (default 9)'
        required: false
        type: string
        default: '9'

jobs:
  pre-tile:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install GDAL
        # ubuntu-24.04 ships gdal-bin 3.8+, plenty new enough for
        # gdal2tiles.py --xyz (added in 3.1). python3-gdal isn't
        # strictly required since tile.py shells out to the CLIs only.
        run: |
          sudo apt-get update
          sudo apt-get install -y gdal-bin
          gdalinfo --version
          gdal2tiles.py --help | head -5

      - name: Install Python deps
        run: |
          pip install --quiet -r etl/requirements.txt

      - name: Pre-tile dataset → R2
        env:
          GRAVITY_GEOTIFF_URL: ${{ inputs.dataset == 'gravity' && inputs.source_url || '' }}
          GRAVITY_MAX_ZOOM: ${{ inputs.dataset == 'gravity' && inputs.max_zoom || '' }}
          AEROMAG_GEOTIFF_URL: ${{ inputs.dataset == 'aeromag' && inputs.source_url || '' }}
          AEROMAG_MAX_ZOOM: ${{ inputs.dataset == 'aeromag' && inputs.max_zoom || '' }}
          RADIOMETRIC_GEOTIFF_URL: ${{ inputs.dataset == 'radiometric' && inputs.source_url || '' }}
          RADIOMETRIC_MAX_ZOOM: ${{ inputs.dataset == 'radiometric' && inputs.max_zoom || '' }}
          # Zip-member selector (for multi-grid .zip bundles) + color-ramp
          # override (to match the grid's physical quantity). Both apply
          # to whichever dataset is selected; empty = pipeline default.
          RASTER_TIF_MEMBER: ${{ inputs.tif_member }}
          RASTER_COLOR_RAMP: ${{ inputs.color_ramp }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
        run: |
          python -m etl.raster.${{ inputs.dataset }}

      - name: Summary
        if: always()
        run: |
          echo "## Raster pre-tile: ${{ inputs.dataset }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- Source URL: ${{ inputs.source_url }}" >> $GITHUB_STEP_SUMMARY
          echo "- Zip member filter: ${{ inputs.tif_member || '(largest .tif)' }}" >> $GITHUB_STEP_SUMMARY
          echo "- Color ramp: ${{ inputs.color_ramp || inputs.dataset }}" >> $GITHUB_STEP_SUMMARY
          echo "- Max zoom: ${{ inputs.max_zoom }}" >> $GITHUB_STEP_SUMMARY
          echo "- R2 key prefix: rasters/${{ inputs.dataset }}/" >> $GITHUB_STEP_SUMMARY
          echo "- Worker URL pattern: /rasters/${{ inputs.dataset }}/{z}/{x}/{y}.png" >> $GITHUB_STEP_SUMMARY
