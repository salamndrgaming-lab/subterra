name: etl-refresh

on:
  schedule:
    # Weekly Sun 02:00 UTC
    - cron: '0 2 * * 0'
  workflow_dispatch:

concurrency:
  group: etl-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: etl/requirements.txt

      - name: Install tippecanoe
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential libsqlite3-dev zlib1g-dev
          git clone --depth=1 https://github.com/felt/tippecanoe.git /tmp/tippecanoe
          cd /tmp/tippecanoe && make -j2 && sudo make install

      - name: Install Python deps
        run: pip install -r etl/requirements.txt

      - name: Run ETL
        env:
          EIA_API_KEY: ${{ secrets.EIA_API_KEY }}
        run: |
          python etl/refresh.py
          echo "--- etl/out contents ---"
          ls -la etl/out
          test -s etl/out/subterra.pmtiles || { echo "::error::pmtiles missing"; exit 1; }
          test -s etl/out/manifest.json   || { echo "::error::manifest missing"; exit 1; }

      - name: Upload PMTiles + manifest to R2 (remote)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          echo "uploading $(du -h etl/out/subterra.pmtiles | cut -f1) of tiles → R2"
          npx --yes wrangler@3 r2 object put \
            subterra-tiles/tiles/subterra.pmtiles \
            --file=etl/out/subterra.pmtiles \
            --remote
          npx --yes wrangler@3 r2 object put \
            subterra-tiles/manifest.json \
            --file=etl/out/manifest.json \
            --content-type=application/json \
            --remote
          echo "--- verifying remote bucket ---"
          npx --yes wrangler@3 r2 object get \
            subterra-tiles/manifest.json --remote --pipe \
            | head -c 400
          echo

      - name: Open issue on failure
        if: failure()
        uses: peter-evans/create-issue-from-file@v5
        with:
          title: 'ETL refresh failed on ${{ github.run_id }}'
          content-filepath: ${{ github.workspace }}/.github/etl-failure-body.md
          labels: 'etl,bug'
        continue-on-error: true
