version: '3.9'

# Local-development infra for Subterra. One command brings up everything the
# app needs: PostgreSQL with PostGIS for geospatial queries, Redis for the
# upstream-call cache. Volumes persist between `docker compose up/down` runs.
#
#   docker compose up -d         # start in background
#   docker compose down          # stop (data persists)
#   docker compose down -v       # stop + wipe data

services:
  postgres:
    image: postgis/postgis:16-3.4
    container_name: subterra-pg
    restart: unless-stopped
    environment:
      POSTGRES_USER: subterra
      POSTGRES_PASSWORD: subterra
      POSTGRES_DB: subterra
    ports:
      - "5432:5432"
    volumes:
      - subterra-pg-data:/var/lib/postgresql/data
      - ./db/schema.sql:/docker-entrypoint-initdb.d/00-schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U subterra -d subterra"]
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7-alpine
    container_name: subterra-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - subterra-redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

volumes:
  subterra-pg-data:
  subterra-redis-data:
